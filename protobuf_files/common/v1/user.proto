syntax = "proto3";

package common.v1;

import "common/v1/uuid.proto";

option go_package = "proto/common/v1";

message UserGroup {
  UUID group_id = 1;
  string group_name = 2;
  repeated UserPermission user_permissions = 3;
}

message User{
  UUID user_id = 1;
  string name = 2;
  UserGroup group = 3;
}

message UsersInGroup{
  repeated User users = 1;
}

message UserPermission{
  UUID permission_id = 1;
  string name = 2;
}