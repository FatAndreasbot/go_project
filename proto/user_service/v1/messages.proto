syntax = "proto3";

package user_service.v1;

import "common/v1/user.proto";
import "common/v1/uuid.proto";

option go_package = "proto/user_service";

message LogInRequest {
  string username = 1;
  string password = 2;
}

message LogInResponse {
  string token = 1;
}

message CreateUserRequest{
  string username = 1;
  string password = 2;
  common.v1.UUID group_id = 3;
}

message CreateUserResponse {
  common.v1.User user = 1;
}

message GetGroupsRequest {
  int32 cursor = 1;
  int32 limit = 2;
}

message GetGroupsResponse {
  repeated common.v1.UserGroup groups = 1;
  int32 next = 2;
}

message GetUserRequest {
  common.v1.UUID user_id = 1;
}

message GetUserResponse {
  common.v1.User user = 1;
}