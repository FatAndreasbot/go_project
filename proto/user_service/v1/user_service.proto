syntax = "proto3";

package user_service.v1;

import "common/v1/user.proto";
import "common/v1/pagination_cursor.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pb/validate.proto";

option go_package = "proto/user_service";

service UserService {
  rpc LogIn(LogInRequest) returns (LogInResponse);
  rpc LogOut(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  // User CRUD
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  rpc UpdateUser(UpdateUserDataRequest) returns (google.protobuf.Empty);
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);

  // Group CRUD
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  rpc GetGroups(GetGroupsRequest) returns (GetGroupsResponse);
  rpc UpdateGroup(UpdateGroupRequest) returns (google.protobuf.Empty);
  rpc AddPermissionToGroup(AddPermissionToGroupRequest) returns (google.protobuf.Empty);
  rpc RemovePermissionFromGroup(RemovePermissionFromGroupRequest) returns (google.protobuf.Empty);
  rpc DeleteGroup(DeleteGroupRequest) returns (google.protobuf.Empty);

  // Permissions
  rpc GetAllPermissions(google.protobuf.Empty) returns (GetPermissionsResponse);
}

// ----------------- Login logout --------------------------------------

message LogInRequest {
  string email = 1[
    (buf.validate.field).string = {
    email: true,
    max_len: 128,
    min_len: 1
    }
  ];
  string password = 2[
    (buf.validate.field).string = {
    min_len: 8,
    max_len: 32,
    pattern: "^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).*$"
    }
  ];
}

message LogInResponse {
  string access_token = 1[
    (buf.validate.field).string = {
    pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$",
    max_len: 4096
    }
  ];
  string refresh_token = 2[
    (buf.validate.field).string = {
    pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$",
    max_len: 4096
    }
  ];
  string user_id = 3[
    (buf.validate.field).string = {
    uuid: true
    }
  ];
  google.protobuf.Timestamp access_expires_at  = 4;
  google.protobuf.Timestamp refresh_expires_at = 5;
}

message RefreshRequest {
  string refresh_token = 1[
    (buf.validate.field).string = {
    pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$",
    max_len: 4096
    }
  ];
}

message RefreshResponse {
  string new_access_token = 1[
    (buf.validate.field).string = {
    pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$",
    max_len: 4096
    }
  ];
  string new_refresh_token = 2[
    (buf.validate.field).string = {
    pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$",
    max_len: 4096
    }
  ];
  google.protobuf.Timestamp access_expires_at  = 4;
  google.protobuf.Timestamp refresh_expires_at = 5;
}

// ----------------- User CRUD -----------------------------------------

message CreateUserRequest{
  string email = 1[
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.email = true
  ];
  string password = 2[
    (buf.validate.field).string = {
    min_len: 8,
    max_len: 32,
    pattern: "^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).*$"
    }
  ];
  string group_id = 3[
    (buf.validate.field).string = {
    uuid: true
    }
  ];
  string idempotency_key = 4[
    (buf.validate.field).string = {
    uuid: true
    }
  ];
}

message CreateUserResponse {
  common.v1.UserData user = 1;
}

message GetUserRequest {
  string user_id = 1[
    (buf.validate.field).string = {
    uuid: true
    }
  ];
}

message GetUserResponse {
  common.v1.UserData user = 1;
}

message GetUsersRequest{
  optional common.v1.PaginationCursor cursor = 1;
  int32                               limit  = 2[
    (buf.validate.field).int32.lte = 100,
    (buf.validate.field).int32.gte = 1
  ];
}

message GetUsersResponse{
  repeated common.v1.UserData users  = 1;
  common.v1.PaginationCursor  cursor = 2;
}

message UpdateUserDataRequest{
  string user_id = 1 [
    (buf.validate.field).string = {
    uuid: true
    }
  ];
  common.v1.UserDataForUpdate user_data = 2;
}

// empty response
// message UpdateUserDataResponse{}

message DeleteUserRequest{
  string user_id = 1[
    (buf.validate.field).string = {
    uuid: true
    }
  ];
}

// empty response
// message DeleteUserResponse{}

// ----------------- Group CRUD ----------------------------------------

message CreateGroupRequest {
  string name = 1[
    (buf.validate.field).string.min_len = 6,
    (buf.validate.field).string.max_len = 64
  ];
  repeated string permission_ids = 2[
    (buf.validate.field).string = {
    uuid: true
    }
  ];
  string idempotency_key = 3[
    (buf.validate.field).string = {
    uuid: true
    }];
}

message CreateGroupResponse {
  common.v1.UserGroup group = 1;
}

message GetGroupRequest{
  string group_id = 1[
    (buf.validate.field).string = {
    uuid: true
    }
  ];
}

message GetGroupResponse {
  common.v1.UserGroup group = 1;
}

message GetGroupsRequest {
  optional common.v1.PaginationCursor cursor = 1; // created_at field
  int32                               limit  = 2[
    (buf.validate.field).int32.lte = 100,
    (buf.validate.field).int32.gte = 1
  ];
}

message GetGroupsResponse {
  repeated common.v1.UserGroupMainData groups = 1;
  common.v1.PaginationCursor           cursor = 2;
}

message UpdateGroupRequest {
  string group_id = 1[
    (buf.validate.field).string.uuid = true
  ];
  string new_name = 2[
    (buf.validate.field).string.min_len = 1
  ];
}

message AddPermissionToGroupRequest{
  string group_id = 1[
    (buf.validate.field).string.uuid = true
  ];
  string permission_id = 2[
    (buf.validate.field).string.uuid = true
  ];
}

message RemovePermissionFromGroupRequest{
  string group_id = 1[
    (buf.validate.field).string.uuid = true
  ];
  string permission_id = 2[
    (buf.validate.field).string.uuid = true
  ];
}

message DeleteGroupRequest {
  string group_id = 1[
    (buf.validate.field).string.uuid = true
  ];
}

// ----------------- Permission list -----------------------------------

message GetPermissionsResponse {
  repeated common.v1.UserPermission permissions = 1;
}