syntax = "proto3";

package user_service.v1;

import "common/v1/user.proto";
import "google/protobuf/empty.proto";
import "validate.proto";

option go_package = "proto/user_service";

service UserService {
  rpc LogIn(LogInRequest) returns (LogInResponse);
  rpc LogOut(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetGroups(GetGroupsRequest) returns (GetGroupsResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetPermissions(GetPermissionsRequest) returns (GetPermissionsResponse);
}

message LogInRequest {
  string email = 1[
    (buf.validate.field).string.email = true
  ];
  string password = 2[
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 32
  ];
}

message LogInResponse {
  string access_token = 1[
    (buf.validate.field).string = {
      pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$",
      max_len: 4096
    }
  ];
  string refresh_token = 2[
    (buf.validate.field).string = {
      pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$",
      max_len: 4096
    }
  ];
}

message RefreshRequest {
  string refresh_token = 1[
    (buf.validate.field).string = {
      pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$",
      max_len: 4096
    }
  ];;
}

message RefreshResponse {
  string new_access_token = 1[
    (buf.validate.field).string = {
      pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$",
      max_len: 4096
    }
  ];;
  string new_refresh_token = 2[
    (buf.validate.field).string = {
      pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$",
      max_len: 4096
    }
  ];;
}

message CreateUserRequest{
  string username = 1[
    (buf.validate.field).string.min_len = 1
  ];
  string password = 2[
    (buf.validate.field).string.min_len = 8
  ];
  string group_id = 3[
    (buf.validate.field).string = {
    uuid: true
    }
  ];
  string idempotency_key = 4[
    (buf.validate.field).string = {
    uuid: true
    }
  ];
}

message CreateUserResponse {
  common.v1.User user = 1;
}

message GetGroupsRequest {
  string last_group_name = 1;
  int32 limit  = 2;
}

message GetGroupsResponse {
  repeated common.v1.UserGroup groups = 1;
  int32                        next   = 2;
}

message GetUserRequest {
  string user_id = 1[
    (buf.validate.field).string = {
    uuid: true
    }
  ];
}

message GetUserResponse {
  common.v1.User user = 1;
}

message GetPermissionsRequest {
  string user_id = 1[
    (buf.validate.field).string = {
    uuid: true
    }
  ];
}

message GetPermissionsResponse {
  repeated common.v1.UserPermission user_permissions = 1;
}