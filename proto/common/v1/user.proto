syntax = "proto3";

package common.v1;

import "common/vendor/validate.proto";

option go_package = "proto/common/v1";

message UserGroup {
  string id = 1[
    (buf.validate.field).string = {
    uuid: true
    }
  ];
  string                  name       = 2[
    (buf.validate.field).string.min_len = 1
  ];
  repeated UserPermission user_permissions = 3;
}

message User{
  string id = 1 [
    (buf.validate.field).string = {
    uuid: true
    }
  ];
  string name    = 2 [
    (buf.validate.field).string.min_len = 1
  ];
  string group_id = 3 [
    (buf.validate.field).string = {
    uuid: true
    }
  ];
}

message UserPermission{
  string permission_id = 1 [
    (buf.validate.field).string = {
    uuid: true
    }
  ];
  string name = 2 [
    (buf.validate.field).string.min_len = 1
  ];
}