syntax = "proto3";

package common.v1;

import "common/vendor/validate.proto";

option go_package = "proto/common/v1";

message UserGroup {
  string group_id = 1[
    (buf.validate.field).string = {
    uuid: true
    }
  ];
  string                  group_name       = 2;
  repeated UserPermission user_permissions = 3;
}

message User{
  string user_id = 1 [
    (buf.validate.field).string = {
    uuid: true
    }
  ];
  string name    = 2;
  string group_id = 3 [
    (buf.validate.field).string = {
    uuid: true
    }
  ];
}

message UsersInGroup{
  repeated User users = 1;
}

message UserPermission{
  string permission_id = 1 [
    (buf.validate.field).string = {
    uuid: true
    }
  ];
  string name = 2;
}